name: Build and Publish Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-debug-apk:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Temurin Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify Java environment
        run: |
          set -euo pipefail
          java -version
          echo "JAVA_HOME=${JAVA_HOME:-}"
          JAVA_VER_LINE="$(java -version 2>&1 | head -n 1 || true)"
          if [[ "$JAVA_VER_LINE" =~ \"([0-9]+)(\.[0-9]+)? ]]; then
            MAJOR="${BASH_REMATCH[1]}"
            if [ "$MAJOR" = "1" ] && [[ "$JAVA_VER_LINE" =~ \"1\.([0-9]+) ]]; then
              MAJOR="${BASH_REMATCH[1]}"
            fi
          else
            echo "::error::Could not detect the active Java major version from: $JAVA_VER_LINE"
            exit 1
          fi
          if ! [[ "$MAJOR" =~ ^[0-9]+$ ]]; then
            echo "::error::Detected Java major version '$MAJOR' is invalid."
            exit 1
          fi
          echo "Active Java major version: $MAJOR"
          if [ "$MAJOR" -lt 17 ]; then
            echo "::error::Java 17 or newer is required, but Java $MAJOR was detected."
            exit 1
          fi

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        run: |
          set -euo pipefail
          if [ ! -f ./debug.keystore ]; then
            KEYTOOL_BIN="${JAVA_HOME:-}/bin/keytool"
            if [ ! -x "$KEYTOOL_BIN" ]; then
              echo "::error::keytool was not found in JAVA_HOME (${JAVA_HOME:-unset})."
              exit 1
            fi
            "$KEYTOOL_BIN" -genkeypair \
              -keystore ./debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -noprompt || {
                echo "::error::Failed to create temporary ./debug.keystore."
                exit 1
              }
          fi
          if [ ! -f ./debug.keystore ] || [ ! -s ./debug.keystore ]; then
            echo "::error::Temporary ./debug.keystore is missing or empty."
            exit 1
          fi
          echo "Temporary debug keystore is present."

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify debug APK
        run: |
          set -euo pipefail
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -e "$APK_PATH" ]; then
            echo "::error::Expected debug APK not found at $APK_PATH"
            if [ -d "app/build/outputs/apk" ]; then
              echo "APK files discovered inside app/build/outputs/apk:"
              find app/build/outputs/apk -type f -name "*.apk" || true
            else
              echo "Directory app/build/outputs/apk does not exist."
            fi
            exit 1
          fi
          if [ ! -f "$APK_PATH" ]; then
            echo "::error::$APK_PATH exists but is not a regular file."
            exit 1
          fi
          if [ ! -s "$APK_PATH" ]; then
            echo "::error::$APK_PATH exists but is empty."
            exit 1
          fi
          if [[ "$APK_PATH" != *.apk ]]; then
            echo "::error::$APK_PATH does not have the .apk extension."
            exit 1
          fi
          echo "Verified debug APK: $APK_PATH"

      - name: Upload debug APK artifact
        id: upload_artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_asset
        run: |
          set -euo pipefail
          SOURCE_APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$SOURCE_APK" ] || [ ! -s "$SOURCE_APK" ]; then
            echo "::error::Verified APK missing at $SOURCE_APK"
            exit 1
          fi
          RAW_REPO_NAME="${GITHUB_REPOSITORY##*/}"
          SAFE_REPO_NAME="$(printf '%s' "$RAW_REPO_NAME" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9._-]+/-/g; s/^-+//; s/-+$//; s/-+/-/g')"
          if [ -z "$SAFE_REPO_NAME" ]; then
            SAFE_REPO_NAME="android-app"
          fi
          RELEASE_DIR="$(mktemp -d "${RUNNER_TEMP:-/tmp}/apk-release-XXXXXX")"
          ASSET_FILENAME="${SAFE_REPO_NAME}-debug-build-${GITHUB_RUN_NUMBER}.apk"
          ASSET_PATH="${RELEASE_DIR}/${ASSET_FILENAME}"
          cp "$SOURCE_APK" "$ASSET_PATH"
          if [ ! -f "$ASSET_PATH" ] || [ ! -s "$ASSET_PATH" ]; then
            echo "::error::Prepared release asset missing or empty at $ASSET_PATH"
            exit 1
          fi
          echo "asset_path=${ASSET_PATH}" >> "$GITHUB_OUTPUT"
          echo "asset_filename=${ASSET_FILENAME}" >> "$GITHUB_OUTPUT"
          echo "Prepared release asset filename: ${ASSET_FILENAME}"

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          ASSET_PATH: ${{ steps.prepare_asset.outputs.asset_path }}
          ASSET_FILENAME: ${{ steps.prepare_asset.outputs.asset_filename }}
        run: |
          set -euo pipefail
          if ! command -v gh >/dev/null 2>&1; then
            echo "::error::GitHub CLI (gh) is not available on this runner."
            exit 1
          fi
          gh --version
          if [ -z "${ASSET_PATH:-}" ] || [ ! -f "$ASSET_PATH" ] || [ ! -s "$ASSET_PATH" ] || [[ "$ASSET_PATH" != *.apk ]]; then
            echo "::error::Prepared release asset is missing, empty, or not an .apk file."
            exit 1
          fi

          RELEASE_TAG="debug-apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          RELEASE_TITLE="Debug APK Build #${GITHUB_RUN_NUMBER}"
          RELEASE_NOTES="$(printf '%s\n' \
            "This is an automatically generated debug APK built by GitHub Actions." \
            "" \
            "- GitHub Actions run number: ${GITHUB_RUN_NUMBER}" \
            "- GitHub Actions run attempt: ${GITHUB_RUN_ATTEMPT}" \
            "- Source commit SHA: ${GITHUB_SHA}" \
            "- Purpose: Intended for testing only (not a Google Play production release)" \
            "- Signing: Signed only with a temporary debug keystore" \
            "- Download: Download \`${ASSET_FILENAME}\` directly from the **Assets** section below.")"

          gh release create "$RELEASE_TAG" "$ASSET_PATH" \
            --target "$GITHUB_SHA" \
            --title "$RELEASE_TITLE" \
            --notes "$RELEASE_NOTES" \
            --latest

      - name: Report APK download result
        if: ${{ always() && steps.prepare_asset.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_OUTCOME: ${{ steps.publish_release.outcome }}
          ASSET_FILENAME: ${{ steps.prepare_asset.outputs.asset_filename }}
        run: |
          set -euo pipefail
          RELEASE_TAG="debug-apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          RELEASE_TITLE="Debug APK Build #${GITHUB_RUN_NUMBER}"

          if [ "$RELEASE_OUTCOME" = "success" ]; then
            gh release view "$RELEASE_TAG"
            RELEASE_URL="$(gh release view "$RELEASE_TAG" --json url --jq '.url')"
            echo "Release tag: $RELEASE_TAG"
            echo "Release title: $RELEASE_TITLE"
            echo "GitHub Release URL: $RELEASE_URL"
            echo "APK asset filename: $ASSET_FILENAME"

            {
              echo "### Debug APK Build & GitHub Release Succeeded"
              echo ""
              echo "- **Release tag:** \`$RELEASE_TAG\`"
              echo "- **Release title:** $RELEASE_TITLE"
              echo "- **APK asset:** \`$ASSET_FILENAME\`"
              echo "- **Release page:** $RELEASE_URL"
              echo ""
              echo "You can download \`$ASSET_FILENAME\` directly from the **Assets** section on the GitHub Release page."
              echo "The normal GitHub Actions artifact (\`app-debug-apk\`) is also available as a backup."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::GitHub Release publishing failed for tag $RELEASE_TAG. The debug APK build succeeded and the Actions artifact 'app-debug-apk' remains available."
            {
              echo "### Warning: GitHub Release Publishing Failed"
              echo ""
              echo "The debug APK build **succeeded**, and the normal GitHub Actions artifact named \`app-debug-apk\` remains available for download from this workflow run."
              echo "GitHub Release publishing did not complete, so no release URL was generated."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
